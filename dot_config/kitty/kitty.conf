# Kitty 终端模拟器 — 完整配置参考
# 官方文档：https://sw.kovidgoyal.net/kitty/conf.html
############################################################

########################################
# fonts
########################################
font_size                16.0
font_family              Maple Mono NF CN
bold_font                Maple Mono NF CN Bold
italic_font              Maple Mono NF CN Italic
bold_italic_font         Maple Mono NF CN Bold Italic
disable_ligatures        never

########################################
# cursor
########################################
cursor_shape              beam
cursor_beam_thickness     1

########################################
# scroll
########################################
scrollback_lines     1000
scrollback_pager     less --chop-long-lines --RAW-CONTROL-CHARS
# scrollback_fill_enlarged_window  no
# scrollback_pager_history_size    10
# scrollback_pager_history_size    0
# scrollback_search_no_case        no

########################################
# mouse
########################################
copy_on_select       yes
open_url_modifiers   ctrl
url_color            #66d9ef
no_mouse_grabbing    yes

########################################
# window
########################################
hide_window_decorations    yes
draw_minimal_borders       yes
window_border_width        1
window_margin_width        0
window_padding_width       1
background_opacity         1

########################################
# tabbar
########################################
tab_bar_min_tabs          1
tab_bar_edge              top
tab_bar_style             powerline
tab_bar_align             left
tab_bar_margin_width      0.0
tab_bar_margin_height     0.0  0.0
active_tab_foreground     #272822
active_tab_background     #66d9ef
active_tab_font_style     bold
inactive_tab_foreground   #75715e
inactive_tab_background   #272822
inactive_tab_font_style   normal
tab_separator             ""
tab_bar_background        #272822
tab_title_template          "{index}:{title}"
active_tab_title_template   "{index}:{title}"
inactive_tab_title_template "{index}:{title}"

########################################
# keybindings
########################################
map ctrl+a>c              new_tab
map ctrl+a>l              next_tab
map ctrl+a>h              previous_tab
map ctrl+a>w              new_window
map ctrl+tab              next_tab
map ctrl+shift+tab        previous_tab
map ctrl+a>1              goto_tab 1
map ctrl+a>2              goto_tab 2
map ctrl+a>3              goto_tab 3
map ctrl+a>4              goto_tab 4
map ctrl+a>5              goto_tab 5
map ctrl+a>6              goto_tab 6
map ctrl+a>7              goto_tab 7
map ctrl+a>8              goto_tab 8
map ctrl+a>9              goto_tab 9

########################################
# colorschema
########################################
foreground              #f8f8f2
background              #272822
selection_foreground    #f9f8f2
selection_background    #49483e
color0                  #272822
color8                  #75715e
color1                  #f92672
color9                  #f92672
color2                  #a6e22e
color10                 #a6e22e
color3                  #f4bf75
color11                 #f4bf75
color4                  #66d9ef
color12                 #66d9ef
color5                  #ae81ff
color13                 #ae81ff
color6                  #a1efe4
color14                 #a1efe4
color7                  #f8f8f2
color15                 #f8f8f2
